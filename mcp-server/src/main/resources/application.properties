# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/REPORTING_DB?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable Hibernate statistics and logging
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.engine.jdbc.batch.internal.BatchingBatch=INFO

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.auto-commit=true
